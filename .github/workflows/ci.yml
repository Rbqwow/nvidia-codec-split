name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run compatibility, rollback and memory-guard tests
        run: python -m unittest discover -s tests -v
      - name: Verify guards also work with Python optimization enabled
        run: python -O -m unittest discover -s tests -v
      - name: Check CLI
        run: python run.py --help
      - name: Test Windows helper shutdown
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tests\test_installer.ps1
      - name: Build Python package
        run: python -m pip wheel . --no-deps --wheel-dir .state/wheels
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'Install.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { throw ($parseErrors | Out-String) }
