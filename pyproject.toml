[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-codec-split"
version = "0.1.0"
description = "Version-checked independent recording codec choices for NVIDIA App"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Rbqwow"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
adaptation = ["pefile>=2023.2.7", "capstone>=5"]

[project.scripts]
nvidia-codec-split = "nvidia_codec_split.cli:main"

[project.urls]
Repository = "https://github.com/Rbqwow/nvidia-codec-split"
Issues = "https://github.com/Rbqwow/nvidia-codec-split/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nvidia_codec_split = ["profiles/*.json"]
